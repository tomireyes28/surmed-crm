name: surmed
services:
  backend:
    image: surmed-backend:${RELEASE_TAG:?Set RELEASE_TAG to the reviewed Git commit}
    build:
      context: ../backend
      target: runtime
    env_file: ${BACKEND_ENV_FILE:-./backend.env}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  frontend:
    image: surmed-frontend:${RELEASE_TAG:?Set RELEASE_TAG to the reviewed Git commit}
    build:
      context: ../frontend
    env_file: ${FRONTEND_ENV_FILE:-./frontend.env}
    environment:
      NODE_ENV: production
      PORT: '3001'
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports: ['127.0.0.1:${WEB_PORT:-3001}:3001']
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
